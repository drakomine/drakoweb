<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAKOMINE - Premium Rank Store</title>
    <meta name="description" content="Purchase premium ranks for DRAKOMINE Minecraft server. Get VIP, VVIP, or AURA+ status with exclusive perks, extra homes, inventory space, and daily rewards." />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #e5e7eb;
        }

        .rank-card {
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(31, 41, 55, 1);
            backdrop-filter: blur(5px);
        }
        .rank-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 30px 40px -10px rgba(0, 0, 0, 0.6);
            border-color: #f59e0b;
        }
        .rank-card.active-rank {
            border-width: 3px;
            border-color: #ef4444;
        }

        .aura-gradient-text {
            background-image: linear-gradient(135deg, #f59e0b, #ef4444, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @keyframes pulse-shadow {
            0%, 100% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 20px rgba(251, 191, 36, 1); }
        }
        .coupon-pulse {
            animation: pulse-shadow 2s infinite;
        }

        .platform-selector input[type="radio"]:checked + label {
            background-color: #ef4444;
            border-color: #fca5a5;
            color: white;
        }
        .platform-selector label {
            transition: all 0.2s ease;
            cursor: pointer;
            border: 2px solid #4b5563;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            flex-grow: 1;
            text-align: center;
            background-color: #1f2937;
            color: #9ca3af;
        }
        .platform-selector label:hover {
            border-color: #ef4444;
        }

        @media (max-width: 768px) {
            .rank-card h2 { font-size: 1.875rem; }
            .rank-card .text-5xl { font-size: 3rem; }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <header class="text-center mb-12">
        <h1 class="text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text aura-gradient-text mb-2 tracking-tighter">
            DRAKOMINE
        </h1>
        <p class="text-lg md:text-xl font-medium text-gray-300 mb-6">"Madness of uniqueness"</p>

        <div class="max-w-md mx-auto p-4 bg-gray-800/80 rounded-xl shadow-lg border border-yellow-700/50 coupon-pulse mb-8">
            <p class="text-sm font-semibold text-yellow-400 uppercase tracking-widest mb-1">Limited Time Offer</p>
            <div class="flex items-center justify-center space-x-3">
                <code class="text-3xl font-mono font-bold text-white bg-gray-900/50 px-4 py-1 rounded-lg">DRAKO</code>
                <span class="text-xl text-yellow-300">for ₹20 OFF!</span>
            </div>
            <p class="text-xs text-gray-500 mt-2">Discount applied automatically at checkout.</p>
        </div>

        <div class="mt-8 bg-gray-800/70 p-4 rounded-xl shadow-2xl max-w-lg mx-auto border border-gray-700/50 flex flex-col sm:flex-row justify-around items-center space-y-4 sm:space-y-0">
            <div class="text-center">
                <p id="purchase-count" class="text-4xl font-black text-yellow-400">0</p>
                <p class="text-sm text-gray-400 uppercase tracking-widest">Recent Purchases</p>
            </div>
            <div class="h-10 w-px bg-gray-600 hidden sm:block"></div>
            <div class="text-center">
                <p id="member-count" class="text-4xl font-black text-red-500">0</p>
                <p class="text-sm text-gray-400 uppercase tracking-widest">Active Members</p>
            </div>
        </div>
        
        <div class="mt-8 bg-gray-800/70 p-4 rounded-xl shadow-2xl max-w-lg mx-auto border border-red-700/50 flex flex-col sm:flex-row justify-center items-center space-y-3 sm:space-x-8 sm:space-y-0">
            <div class="text-center flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-red-500 w-6 h-6 mr-3"><rect x="2" y="2" width="20" height="8" rx="2"></rect><rect x="2" y="14" width="20" height="8" rx="2"></rect></svg>
                <div>
                    <p class="text-sm text-gray-400 uppercase tracking-widest mb-1">Server IP</p>
                    <code class="text-xl font-mono font-bold text-white select-all">drako.mine.bz</code>
                </div>
            </div>
            <div class="h-8 w-px bg-gray-600 hidden sm:block"></div>
            <div class="text-center flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-red-500 w-6 h-6 mr-3"><path d="M18 6A6 6 0 0 0 6 6c0 7 6 12 6 12s6-5 6-12z"></path></svg>
                <div>
                    <p class="text-sm text-gray-400 uppercase tracking-widest mb-1">Port (Bedrock)</p>
                    <code class="text-xl font-mono font-bold text-white">25531</code>
                </div>
            </div>
        </div>
    </header>

    <main id="ranks-container" class="grid md:grid-cols-3 gap-8 max-w-6xl mx-auto"></main>
    
    <div id="payment-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-gray-900 rounded-xl p-6 w-11/12 max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
            <div id="modal-step-1"></div>
            <div id="modal-step-2" class="hidden"></div>
        </div>
    </div>

    <script>
        const qrCodeImage = "/payment-qr.jpg";
        const ranksData = [
            {
                name: 'VIP Status', price: 60, description: 'The essential upgrade.', color: 'yellow', isPopular: false, buttonText: 'Buy VIP', featureIconColor: '#facc15',
                features: [
                    { text: '<strong>VIP Tag</strong> in Discord & Server' },
                    { text: 'Can set <strong>2 homes</strong> at a time' },
                    { text: 'Extra inventory <strong>Level 4 (bp)</strong>' },
                    { text: 'Can have <strong>20 shops</strong> at a time' },
                    { text: '<strong>3 extra hearts</strong>' },
                    { text: 'Can use <strong>/rtp free</strong>' },
                    { text: '<strong>$50 Daily Reward</strong>' },
                    { text: 'Good Support' }
                ]
            },
            {
                name: 'VVIP Status', price: 110, description: 'The full server experience.', color: 'red', isPopular: true, buttonText: 'Buy VVIP', featureIconColor: '#f87171',
                features: [
                    { text: '<strong>VVIP Tag</strong> in Discord & Server' },
                    { text: 'Can set <strong>5 homes</strong> at a time' },
                    { text: 'Extra inventory <strong>Level 6 (bp)</strong>' },
                    { text: 'Can have <strong>50 shops</strong> at a time' },
                    { text: '<strong>10 extra hearts</strong>' },
                    { text: '<strong>Carry Villager</strong> in inventory' },
                    { text: 'Can use <strong>/rtp free</strong>' },
                    { text: '<strong>$100 Daily Reward</strong>' },
                    { text: '<strong>Premium Support</strong>' }
                ]
            },
            {
                name: 'AURA+ Status', price: 170, description: 'Maximum power and convenience.', color: 'purple', isPopular: false, buttonText: 'Buy AURA+', featureIconColor: '#c084fc',
                features: [
                    { text: '<strong>AURA+ Tag</strong> in Discord & Server' },
                    { text: 'Can set <strong>7 homes</strong> at a time' },
                    { text: 'Extra inventory <strong>Level 6 (bp)</strong>' },
                    { text: 'Can have <strong>60 shops</strong> at a time' },
                    { text: 'Massive <strong>20 extra hearts</strong>' },
                    { text: '<strong>Carry Villager</strong> in inventory' },
                    { text: '<strong>Carry Mobs</strong> in inventory' },
                    { text: 'Exclusive Command: <strong>Night Vision (/nv)</strong>' },
                    { text: '<strong>$300 Daily Reward</strong>' },
                    { text: '<strong>$3,000 Instant</strong> cash-in' },
                    { text: 'Can use <strong>/rtp free</strong>' },
                    { text: '<strong>Premium Support</strong>' }
                ]
            }
        ];

        let currentModalRank = null;
        let modalState = { username: '', platform: 'Java', email: '' };

        const renderRanks = () => {
            document.getElementById('ranks-container').innerHTML = ranksData.map(rank => {
                const featuresHtml = rank.features.map(f => `<li class="flex items-start"><span class="mr-2">✓</span><div>${f.text}</div></li>`).join('');
                return `
                    <section class="rank-card rounded-2xl p-6 shadow-xl ${rank.isPopular ? 'active-rank md:scale-105' : ''}">
                        <div class="text-center mb-6">
                            ${rank.isPopular ? '<div class="inline-block bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase mb-2">Most Popular</div>' : ''}
                            <h2 class="${rank.name === 'AURA+ Status' ? 'text-3xl font-bold aura-gradient-text' : 'text-3xl font-bold'}" style="color: ${rank.featureIconColor}">${rank.name}</h2>
                            <p class="text-base text-gray-400">${rank.description}</p>
                            <div class="mt-3">
                                <span class="text-5xl font-black text-white">₹${rank.price}</span>
                                <span class="text-xl font-medium text-gray-400">/ Month</span>
                            </div>
                        </div>
                        <ul class="space-y-3 text-sm mb-8 list-none p-0">${featuresHtml}</ul>
                        <button onclick="openModal('${rank.name}')" class="w-full bg-${rank.color}-600 hover:bg-${rank.color}-500 font-bold py-3 rounded-xl text-white">${rank.buttonText}</button>
                    </section>
                `;
            }).join('');
        };

        window.openModal = (rankName) => {
            currentModalRank = ranksData.find(r => r.name === rankName);
            modalState = { username: '', platform: 'Java', email: '' };
            showStep(1);
            document.getElementById('payment-modal').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('payment-modal').classList.add('hidden');
        };

        window.showStep = (step) => {
            const finalPrice = currentModalRank.price - 20;
            if (step === 1) {
                document.getElementById('modal-step-1').innerHTML = `
                    <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500">✕</button>
                    <h3 class="text-2xl font-bold text-white mb-4">Checkout: ${currentModalRank.name}</h3>
                    <div class="p-3 bg-gray-800 rounded-lg border border-gray-700 mb-4">
                        <div class="flex justify-between"><span>Original Price:</span><span class="line-through">₹${currentModalRank.price}</span></div>
                        <div class="flex justify-between text-yellow-400"><span>Discount (DRAKO):</span><span>- ₹20</span></div>
                        <div class="flex justify-between mt-2 pt-2 border-t border-gray-600 text-xl font-bold"><span>Total:</span><span>₹${finalPrice}</span></div>
                    </div>
                    <form id="details-form" class="space-y-4">
                        <input type="text" id="username" placeholder="Minecraft Username" required class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 text-white placeholder-gray-400"/>
                        <div class="flex gap-4 platform-selector">
                            <input type="radio" id="java" name="platform" value="Java" checked class="hidden"/>
                            <label for="java" class="flex-1">Java</label>
                            <input type="radio" id="bedrock" name="platform" value="Bedrock" class="hidden"/>
                            <label for="bedrock" class="flex-1">Bedrock</label>
                        </div>
                        <input type="email" id="email" placeholder="Email (Optional)" class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 text-white placeholder-gray-400"/>
                        <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl">Proceed to Payment</button>
                    </form>
                `;
                document.getElementById('details-form').onsubmit = (e) => {
                    e.preventDefault();
                    modalState.username = document.getElementById('username').value;
                    modalState.platform = document.querySelector('input[name="platform"]:checked').value;
                    modalState.email = document.getElementById('email').value;
                    if (!modalState.username.trim()) {
                        alert('Please enter your Minecraft Username.');
                        return;
                    }
                    showStep(2);
                };
                document.getElementById('modal-step-1').classList.remove('hidden');
                document.getElementById('modal-step-2').classList.add('hidden');
            } else {
                document.getElementById('modal-step-2').innerHTML = `
                    <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500">✕</button>
                    <h3 class="text-2xl font-bold text-white mb-4 text-center">Scan to Pay</h3>
                    <p class="text-gray-400 text-center mb-4">Scan the QR code to pay <strong class="text-white">₹${finalPrice}</strong></p>
                    <div class="flex justify-center mb-4">
                        <div class="p-2 bg-white rounded-lg border-2 border-gray-400">
                            <img src="${qrCodeImage}" alt="Payment QR Code" class="rounded-md w-64 h-64"/>
                        </div>
                    </div>
                    <div class="text-sm bg-gray-800 p-3 rounded-lg border border-gray-700 mb-4">
                        <p><strong>Username:</strong> <span class="font-mono">${modalState.username}</span></p>
                        <p><strong>Rank:</strong> <span class="font-mono">${currentModalRank.name}</span></p>
                        <p><strong>Platform:</strong> <span class="font-mono">${modalState.platform}</span></p>
                    </div>
                    <button onclick="handleMailRedirect()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl mb-2">I've Paid! Submit Proof</button>
                    <button onclick="showStep(1)" class="w-full text-gray-400 hover:text-white py-2">Back to details</button>
                `;
                document.getElementById('modal-step-1').classList.add('hidden');
                document.getElementById('modal-step-2').classList.remove('hidden');
            }
        };

        window.handleMailRedirect = () => {
            const subject = encodeURIComponent(`DRAKOMINE Rank Purchase - ${modalState.username}`);
            const body = encodeURIComponent(`Username: ${modalState.username}\nRank: ${currentModalRank.name}\nPlatform: ${modalState.platform}\nEmail: ${modalState.email || 'Not provided'}\n\n--- Please attach your payment screenshot here ---`);
            window.location.href = `mailto:drakomine.official@gmail.com?subject=${subject}&body=${body}`;
            closeModal();
        };

        document.getElementById('payment-modal').addEventListener('click', (e) => {
            if (e.target.id === 'payment-modal') closeModal();
        });

        const animateCounter = (el, end) => {
            let start = 0;
            const duration = 2000;
            const startTime = performance.now();
            const animate = (timestamp) => {
                const progress = Math.min((timestamp - startTime) / duration, 1);
                el.textContent = Math.floor(end * progress);
                if (progress < 1) requestAnimationFrame(animate);
            };
            requestAnimationFrame(animate);
        };

        renderRanks();
        animateCounter(document.getElementById('purchase-count'), 6);
        animateCounter(document.getElementById('member-count'), 50);
    </script>
</body>
</html>
