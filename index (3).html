    <style>
        /* Custom font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117; /* Dark charcoal/GitHub dark theme */
            color: #e5e7eb;
        }

        /* Custom styles for premium look */
        .rank-card {
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(31, 41, 55, 1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .rank-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 30px 40px -10px rgba(0, 0, 0, 0.6), 0 10px 15px -5px rgba(0, 0, 0, 0.4);
            border-color: #f59e0b;
        }
        .rank-card.active-rank {
            border-width: 3px;
            border-color: #ef4444;
        }

        /* Gradient for AURA+ */
        .aura-gradient-text {
            background-image: linear-gradient(135deg, #f59e0b, #ef4444, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .purchase-button {
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.3s ease;
        }
        .purchase-button:active {
            transform: scale(0.98);
        }

        /* Animation for Coupon */
        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 20px rgba(251, 191, 36, 1); }
            100% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.5); }
        }
        .coupon-pulse {
            animation: pulse-shadow 2s infinite;
        }

        /* --- Mobile Scaling & Responsiveness FIX --- */
        @media (max-width: 768px) {
            .feature-grid {
                grid-template-columns: repeat(1, minmax(0, 1fr));
            }
            
            .rank-card h2 {
                font-size: 1.875rem;
            }
            .rank-card .text-5xl {
                font-size: 3rem;
            }
            
            .status-counter {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                width: 100%;
            }
            .status-counter > div:nth-child(2) {
                display: none;
            }
            .status-counter > div {
                padding-top: 0.5rem;
                padding-bottom: 0.5rem;
            }
            
            .server-stats {
                flex-direction: column;
                align-items: flex-start;
                padding-left: 2rem;
                padding-right: 2rem;
            }
            .server-stats > div {
                margin-top: 0.5rem;
                margin-bottom: 0.5rem;
            }
            .server-stats .h-8 {
                display: none;
            }
        }
        .modal-content-area {
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content-area::-webkit-scrollbar {
            width: 6px;
            background-color: #1f2937;
        }
        .modal-content-area::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 3px;
        }

        /* --- Custom Platform Selector Styling --- */
        .platform-selector input[type="radio"]:checked + label {
            background-color: #ef4444;
            border-color: #fca5a5;
            color: white;
        }
        .platform-selector input[type="radio"]:checked + label .icon-color {
            color: white;
        }
        .platform-selector label {
            transition: all 0.2s ease;
            cursor: pointer;
            border: 2px solid #4b5563;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            flex-grow: 1;
            text-align: center;
            background-color: #1f2937;
            color: #9ca3af;
        }
        .platform-selector label:hover {
            border-color: #ef4444;
        }
        
        /* Modal backdrop transition setup */
        .modal-backdrop {
            transition: opacity 0.3s ease;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #374151 inset !important;
            -webkit-text-fill-color: white !important;
        }
        .hidden {
            display: none;
        }
    </style>

                        { icon: lucideIcons.Eye, text: 'Exclusive Command: <strong class="font-semibold">Night Vision (/nv)</strong>' },
                        { icon: lucideIcons.DollarSign, text: '<strong class="font-semibold">$300 Daily Reward</strong>' },
                        { icon: lucideIcons.Banknote, text: '<strong class="font-semibold">$3,000 Instant</strong> cash-in' },
                        { icon: lucideIcons.LocateFixed, text: 'Can use <strong class="font-semibold">/rtp free</strong>' },
                        { icon: lucideIcons.Headset, text: '<strong class="font-semibold">Premium Support</strong>' }
                    ]
                }
            ];

            // --- STATE MANAGEMENT ---
            let currentModalRank = null;
            let modalState = {
                username: '',
                platform: 'Java',
                email: ''
            };

            // --- UI ELEMENTS ---
            const ranksContainer = document.getElementById('ranks-container');
            const modalElement = document.getElementById('payment-modal');
            const modalContentArea = document.getElementById('modal-content-area');
            const modalStep1 = document.getElementById('modal-step-1');
            const modalStep2 = document.getElementById('modal-step-2');

            // --- RENDER FUNCTIONS ---
            const renderRanks = () => {
                ranksContainer.innerHTML = ranksData.map(rank => {
                    const cardClasses = `rank-card rounded-2xl p-6 shadow-xl ${rank.isPopular ? 'active-rank md:scale-105' : ''} ${rank.hoverColor}`;
                    const titleClasses = rank.name === 'AURA+ Status' ? 'text-3xl font-bold text-transparent bg-clip-text aura-gradient-text' : `text-3xl font-bold text-${rank.color}-300`;
                    const buttonClasses = `w-full bg-${rank.color}-600 hover:bg-${rank.color}-500 font-bold py-3 rounded-xl purchase-button shadow-lg ${rank.isPopular ? `text-white shadow-${rank.color}-500/50` : 'text-gray-900'}`;
                    
                    const featuresHtml = rank.features.map(feature => `
                        <li class="flex items-start">
                            <span style="color: ${rank.featureIconColor}">${feature.icon}</span>
                            <div>${feature.text}</div>
                        </li>
                    `).join('');

                    return `
                        <section class="${cardClasses}">
                            <div class="text-center mb-6">
                                ${rank.isPopular ? `<div class="inline-block bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2">Most Popular</div>` : ''}
                                <h2 class="${titleClasses}">${rank.name}</h2>
                                <p class="text-base text-gray-400">${rank.description}</p>
                                <div class="mt-3">
                                    <span class="text-5xl font-black text-white">₹${rank.price}</span>
                                    <span class="text-xl font-medium text-gray-400">/ Month</span>
                                </div>
                            </div>
                            <ul class="space-y-3 text-sm mb-8 list-none p-0">${featuresHtml}</ul>
                            <button onclick="openModal('${rank.name}')" class="${buttonClasses}">
                                ${rank.buttonText}
                            </button>
                        </section>
                    `;
                }).join('');
            };
            
            const renderModalStep1 = (rank) => {
                const finalPrice = rank.price - 20;
                modalStep1.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex justify-between items-center pb-2 border-b border-gray-700">
                            <h3 class="text-2xl font-bold text-white">Checkout: ${rank.name}</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 p-1 rounded-full transition duration-150">${lucideIcons.X}</button>
                        </div>
                        <p class="text-gray-400 text-sm">Fill in your details to finalize your purchase.</p>
                        <div class="p-3 bg-gray-800 rounded-lg border border-gray-700">
                            <div class="flex justify-between items-baseline"><span class="text-gray-300">Original Price:</span><span class="text-gray-400 line-through">₹${rank.price}</span></div>
                            <div class="flex justify-between items-baseline"><span class="text-yellow-400 font-semibold">Discount (DRAKO):</span><span class="text-yellow-400 font-semibold">- ₹20</span></div>
                            <div class="flex justify-between items-baseline mt-2 pt-2 border-t border-gray-600"><span class="text-xl font-bold text-white">Total:</span><span class="text-xl font-bold text-white">₹${finalPrice}</span></div>
                        </div>
                        <form id="details-form" class="space-y-4 pt-2">
                            <div>
                                <label for="username" class="block text-sm font-medium text-gray-300 mb-2">Minecraft Username</label>
                                <div class="relative">${lucideIcons.User}<input type="text" id="username" value="${modalState.username}" required placeholder="Your Exact In-Game Name" class="w-full p-3 pl-10 rounded-lg bg-gray-700 border border-gray-600 focus:ring-2 focus:ring-red-500 focus:border-red-500 text-white placeholder-gray-400 transition duration-150"/></div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">Platform</label>
                                <div class="flex gap-4 platform-selector">
                                    <input type="radio" id="java" name="platform" value="Java" ${modalState.platform === 'Java' ? 'checked' : ''} class="hidden"/>
                                    <label for="java" class="flex items-center justify-center gap-2">${lucideIcons.Gamepad2} Java</label>
                                    <input type="radio" id="bedrock" name="platform" value="Bedrock" ${modalState.platform === 'Bedrock' ? 'checked' : ''} class="hidden"/>
                                    <label for="bedrock" class="flex items-center justify-center gap-2">${lucideIcons.Gamepad2} Bedrock</label>
                                </div>
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email Address (Optional)</label>
                                <div class="relative">${lucideIcons.Mail}<input type="email" id="email" value="${modalState.email}" placeholder="For purchase confirmation" class="w-full p-3 pl-10 rounded-lg bg-gray-700 border border-gray-600 focus:ring-2 focus:ring-red-500 focus:border-red-500 text-white placeholder-gray-400 transition duration-150"/></div>
                            </div>
                            <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl purchase-button flex items-center justify-center gap-2">${lucideIcons.QrCode} Proceed to Payment</button>
                        </form>
                    </div>
                `;

                document.getElementById('details-form').addEventListener('submit', handleFormSubmit);
                document.querySelectorAll('input[name="platform"]').forEach(radio => radio.addEventListener('change', (e) => modalState.platform = e.target.value));
            };

            const renderModalStep2 = (rank) => {
                const finalPrice = rank.price - 20;
                modalStep2.innerHTML = `
                    <div class="space-y-4 text-center">
                        <div class="flex justify-between items-center pb-2 border-b border-gray-700">
                            <h3 class="text-2xl font-bold text-white">Scan to Pay</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 p-1 rounded-full transition duration-150">${lucideIcons.X}</button>
                        </div>
                        <p class="text-gray-400">Scan the QR code below with your payment app to pay <strong class="text-white">₹${finalPrice}</strong>.</p>
                        <div class="p-2 bg-white rounded-lg inline-block border-2 border-gray-400 shadow-lg">
                            <img src="${qrCodeImage}" alt="Payment QR Code" class="rounded-md w-64 h-64" />
                        </div>
                        <div class="text-left text-sm bg-gray-800 p-3 rounded-lg border border-gray-700">
                            <p><strong class="text-gray-300">Username:</strong> <span class="font-mono text-white">${modalState.username}</span></p>
                            <p><strong class="text-gray-300">Rank:</strong> <span class="font-mono text-white">${rank.name}</span></p>
                            <p><strong class="text-gray-300">Platform:</strong> <span class="font-mono text-white">${modalState.platform}</span></p>
                        </div>
                        <button onclick="handleMailRedirect()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl purchase-button flex items-center justify-center gap-2">${lucideIcons.Send} I've Paid! Submit Proof</button>
                        <button onclick="showStep(1)" class="w-full text-gray-400 hover:text-white text-sm py-2 rounded-lg transition">Back to details</button>
                    </div>
                `;
            };

            // --- EVENT HANDLERS & LOGIC ---
            
            const handleFormSubmit = (e) => {
                e.preventDefault();
                modalState.username = document.getElementById('username').value;
                modalState.email = document.getElementById('email').value;
                if (!modalState.username.trim()) {
                    alert('Please enter your Minecraft Username.');
                    return;
                }
                showStep(2);
            };

            window.handleMailRedirect = () => {
                const subject = encodeURIComponent(`DRAKOMINE Rank Purchase - ${modalState.username}`);
                const body = encodeURIComponent(`Username: ${modalState.username}\nRank: ${currentModalRank.name}\nPlatform: ${modalState.platform}\nEmail: ${modalState.email || 'Not provided'}\n\n--- Please attach your payment screenshot here ---`);
                window.location.href = `mailto:drakomine.official@gmail.com?subject=${subject}&body=${body}`;
                closeModal();
            };

            window.openModal = (rankName) => {
                currentModalRank = ranksData.find(r => r.name === rankName);
                if (!currentModalRank) return;
                
                modalState = { username: '', platform: 'Java', email: '' }; // Reset state
                showStep(1);
                modalElement.classList.remove('hidden');
                setTimeout(() => modalContentArea.classList.replace('scale-95', 'scale-100'), 10);
            };

            window.closeModal = () => {
                modalContentArea.classList.replace('scale-100', 'scale-95');
                setTimeout(() => {
                    modalElement.classList.add('hidden');
                    currentModalRank = null;
                }, 300);
            };

            window.showStep = (step) => {
                if (step === 1) {
                    renderModalStep1(currentModalRank);
                    modalStep1.classList.remove('hidden');
                    modalStep2.classList.add('hidden');
                } else if (step === 2) {
                    renderModalStep2(currentModalRank);
                    modalStep1.classList.add('hidden');
                    modalStep2.classList.remove('hidden');
                }
                 modalContentArea.scrollTop = 0;
            };
            
            modalElement.addEventListener('click', (e) => {
                 if (e.target === modalElement) closeModal();
            });

            // --- ANIMATION ---
            const animateCounter = (element, end, duration = 2000) => {
                let start = 0;
                const startTime = performance.now();
                const animate = (timestamp) => {
                    const progress = timestamp - startTime;
                    const percentage = Math.min(progress / duration, 1);
                    start = Math.floor(end * percentage);
                    element.textContent = start;
                    if (progress < duration) {
                        requestAnimationFrame(animate);
                    } else {
                        element.textContent = end;
                    }
                };
                requestAnimationFrame(animate);
            };

            // --- INITIALIZATION ---
            renderRanks();
            animateCounter(document.getElementById('purchase-count'), 6);
            animateCounter(document.getElementById('member-count'), 50);
        });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
